# SMM Agent: web (gunicorn) + scheduler (fon ishchi) + MySQL [+ Cloudflare Tunnel ixtiyoriy]
# Ishga tushirish:  docker compose up -d --build
# Cloudflare Tunnel bilan:  docker compose --profile tunnel up -d --build   (.env da TUNNEL_TOKEN kerak)
x-app-env: &app-env
  SECRET_KEY: ${SECRET_KEY}
  DEBUG: ${DEBUG:-0}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
  BEHIND_PROXY: ${BEHIND_PROXY:-1}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
  DB_NAME: ${DB_NAME:-smm_db}
  DB_USER: ${DB_USER:-root}
  DB_PASSWORD: ${DB_PASSWORD}
  DB_HOST: ${DB_HOST:-db}
  DB_PORT: ${DB_PORT:-3306}
  DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-admin}
  DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-}
  DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-}
  TZ: Asia/Tashkent

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-smm_db}
      TZ: Asia/Tashkent
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20

  web:
    build: .
    restart: unless-stopped
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./.env:/app/.env          # sozlamalar sahifasi shu faylni yangilaydi
    ports:
      - "${WEB_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/session/')"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s

  scheduler:
    build: .
    restart: unless-stopped
    command: ["python", "manage.py", "run_scheduler"]
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "0"
    depends_on:
      web:
        condition: service_healthy
    volumes:
      - ./.env:/app/.env

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - web

volumes:
  db_data:
